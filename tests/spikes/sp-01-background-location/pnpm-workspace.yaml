# SP-01 is its own pnpm root (outside the Wayvro workspace, tests/spikes/README.md). A flat (hoisted) node_modules keeps
# React Native native-build paths under the Windows/CMake object-path limit (SP-AND evidence, ADR-034/ADR-036).
# pnpm's default minimumReleaseAge (24 h) stays in force with no exclusions.
nodeLinker: hoisted
# Security override (same entry and reason as the root pnpm-workspace.yaml, 2026-11-03): node-forge via @expo/cli.
# Install without --ignore-workspace, or this file (nodeLinker and overrides) is ignored.
overrides:
  'node-forge@<1.4.2': 1.4.2
