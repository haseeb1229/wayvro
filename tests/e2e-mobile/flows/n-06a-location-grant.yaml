# SP-08 #11 / LOC-05, part 1 of 2 (N, API 35): grant when-in-use location, then leave the app in the background.
# run-flows.mjs then revokes the permission with `pm revoke` (Android kills the process, as on a real revocation).
appId: dev.wayvro.app
name: n-06a-location-grant
tags: [full, api35-dialogs]
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      PHONE: ${PHONE_A}
      PHONE_LOCAL: ${PHONE_LOCAL_A}
- extendedWaitUntil:
    visible:
      id: rider-home-where-to
    timeout: 60000
- scrollUntilVisible:
    element: 'Use current location'
    direction: DOWN
- tapOn: 'Use current location'
- extendedWaitUntil:
    visible: 'Use your location for pickup\?'
    timeout: 30000
- scrollUntilVisible:
    element: 'Continue'
    direction: DOWN
- tapOn: 'Continue'
- tapOn:
    id: 'com\.android\.permissioncontroller:id/permission_allow_foreground_only_button'
- pressKey: Home
