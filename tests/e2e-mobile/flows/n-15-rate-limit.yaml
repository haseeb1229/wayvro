# SP-08 #17 (N) — I11 (client): price checks beyond the account's quote rate limit show the "Too many price checks"
# state with the retry seconds, no price and no retry storm. The E2E stack sets QUOTES_PER_MINUTE_ACCOUNT=3 (a UI loop
# cannot exceed the production default of 20/min). Each loop pass stays inside search -> quote (one back, re-choose the
# pickup), so a new quote is requested per pass and the app is never backed out. REQUIRES ACTIVE synthetic rate cards.
appId: dev.wayvro.app
name: n-15-rate-limit
tags: [full, pricing]
---
- runFlow:
    file: subflows/sign-in.yaml
    env:
      PHONE: ${PHONE_A}
      PHONE_LOCAL: ${PHONE_LOCAL_A}
- extendedWaitUntil:
    visible:
      id: rider-home-where-to
    timeout: 60000
- tapOn:
    id: rider-home-where-to
- extendedWaitUntil:
    visible: 'Drop-off'
    timeout: 30000
- inputText: 'Liberty'
- tapOn: 'Liberty Market.*'
- tapOn:
    id: search-pickup
- inputText: 'Emporium'
- tapOn: 'Emporium Mall.*'
- extendedWaitUntil:
    visible: '.*(Economy|Too many price checks).*'
    timeout: 60000
# bounded loop: at most 6 more price checks; it stops as soon as the rate-limited state is shown
- repeat:
    times: 6
    while:
      notVisible: 'Too many price checks'
    commands:
      - back
      - extendedWaitUntil:
          visible:
            id: search-pickup
          timeout: 30000
      - tapOn:
          id: search-pickup
      - eraseText
      - inputText: 'Emporium'
      - tapOn: 'Emporium Mall.*'
      - extendedWaitUntil:
          visible: '.*(Economy|Too many price checks).*'
          timeout: 60000
- assertVisible: 'Too many price checks'
- assertVisible: '.*Too many attempts.*'
- assertNotVisible: '.*Rs.*'
- takeScreenshot: n-15-rate-limited
