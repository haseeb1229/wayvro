# osv-scanner exceptions (Q09: documented, owner, expiry). Each entry is a build/dev-tooling dependency that is not
# reachable with untrusted input in Wayvro and has no safe upgrade today. CI fails again when an exception expires.
# Owner: founder (haseeb1229). Review every exception before its ignoreUntil date.

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-09
reason = "braces 3.0.3 (no fixed release): stack-exhaustion DoS needs attacker-controlled deeply nested glob patterns; only reached via micromatch in lint/build tooling with patterns from repository config."

[[IgnoredVulns]]
id = "GHSA-86w9-cpqp-85rv"
ignoreUntil = 2027-01-09
reason = "node-forge 1.4.0 (no fixed release): RSA PKCS#1 v1.5 verification flaw; used only by @expo/cli (developer CLI) for EAS Update code signing, which is disabled (app.config.ts updates.enabled=false); never bundled into the app."

[[IgnoredVulns]]
id = "GHSA-w5hq-g745-h8pq"
ignoreUntil = 2027-01-09
reason = "uuid 7.0.3 via xcode@3.0.1 (@expo/config-plugins): missing bounds check only when callers pass their own buffer to v3/v5/v6; used at prebuild time to generate iOS project ids, never with untrusted input; upgrade blocked by the transitive pin."

[[IgnoredVulns]]
id = "GHSA-67mh-4wv8-2f99"
ignoreUntil = 2027-01-09
reason = "esbuild 0.18.20 via drizzle-kit/@esbuild-kit: the advisory concerns esbuild's development server (permissive CORS); drizzle-kit only uses esbuild to load its config file and never starts a server. Also present in the SP-03 disposable spike lockfile."

# RUNTIME exception (unlike the tooling entries above) — decode-uri-component is in the mobile JS bundle.
[[IgnoredVulns]]
id = "GHSA-vcc3-ghjq-m6fr"
ignoreUntil = 2026-12-31
reason = "decode-uri-component 0.2.2 via query-string 7.1.3 (pinned by expo-router 57.0.25): CPU-exhaustion DoS on malformed percent-encoding (availability only). The fix 0.5.0 is ESM-only and query-string 7 require()s a callable CJS default, so an override would break routing. Reachability (corrected in Phase 3 P3.0, F-P3-01): RELEASE builds register no URL scheme, app link or universal link and export only the launcher activity — verified on every CI run against the release AAB by infra/ci/android/check-intent-filters.mjs (until P3.0 the expo-dev-client exp+wayvro scheme also reached release builds, which made the earlier premise untrue). Only DEVELOPMENT builds on developer devices keep exp+wayvro for the dev launcher. GATE: re-check before any deep link/URL scheme is wired (must upgrade expo-router/query-string or bound URL length first); expires 2026-12-31 and is not extended without a fresh, truthful reachability review."

# Version-scoped exceptions (2026-10-29). PackageOverrides match ONE exact package version, so a runtime copy of the same
# package at another version is still scanned. Both are reached only by Expo's developer tooling (prebuild/CLI) and are
# not in the app's JS bundle, the API, the realtime gateway or the worker (those use zod 4.6.6).
[[PackageOverrides]]
name = "deepmerge"
version = "4.3.1"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2027-01-31
reason = "GHSA-gcqx-w48m-w2h4 (no fixed release; 4.3.1 is the last version): prototype poisoning of merged objects needs attacker-controlled input. Only @expo/config uses it, at prebuild/CLI time, to merge app config from repository files; never bundled into the app or a server."

[[PackageOverrides]]
name = "zod"
version = "3.25.76"
ecosystem = "npm"
vulnerability.ignore = true
effectiveUntil = 2027-01-31
reason = "GHSA-mrhx-c7xc-m3w5 (fixed only in zod 4.6.6; no 3.x fix): memory exhaustion when validating oversized constrained collections. This copy belongs to @expo/cli (developer CLI: dev server, prebuild) and validates its own config/CLI data; the app bundle and every server use zod 4.6.6. Re-check when Expo moves @expo/cli to zod 4."
